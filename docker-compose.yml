services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: peblo
      POSTGRES_USER: peblo
      POSTGRES_PASSWORD: peblo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peblo -d peblo"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://peblo:peblo@db:5432/peblo
      JWT_SECRET: change-me-in-production
      STORAGE_BACKEND: local
      STORAGE_PATH: /app/storage
      CATALOGUE_DIR: /app/storage/catalogue
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - storage_data:/app/storage
      - ./data:/app/data:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  cms:
    build: ./cms
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy

  viewer:
    build: ./viewer
    ports:
      - "3001:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  storage_data:
